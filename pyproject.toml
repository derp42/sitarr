[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sitarr"
version = "0.1.0"
description = "A library sitter: age guidance and parental controls for Jellyfin and Plex."
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1",
  "beautifulsoup4>=4.12,<5", "jinja2>=3.1,<4",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "ruff>=0.8,<1"]

[tool.setuptools.packages.find]
include = ["sitarr*"]

[tool.setuptools.package-data]
sitarr = ["templates/*", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

